[package]
name = "oppai-zero-burn"
version = "0.1.0"
authors = ["Evgeny Kurnevsky <kurnevsky@gmail.com>"]
license = "AGPL-3.0+"
description = "Open Points Artificial Intelligence"
edition = "2024"

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
num-traits.workspace = true
burn = { workspace = true, features = ["optim", "autotune", "extension"] }
burn-pack.workspace = true
burn-cubecl = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
log.workspace = true
oppai-zero = { path = "../zero" }
derive_more = { workspace = true, features = ["from"] }

[dev-dependencies]
futures.workspace = true

[features]
cuda = ["burn/cuda", "cube"]
rocm = ["burn/rocm", "cube"]
flex = ["burn/flex"]
vulkan = ["burn/vulkan", "cube"]
webgpu = ["burn/webgpu", "cube"]
# The GPU kernels of the distance attention, see `distance_attention`. Enabled
# by every GPU backend.
cube = ["dep:burn-cubecl", "dep:cubecl"]
# Has to be on whenever burn's own `fusion` feature is: the GPU backend is then
# fused, and the distance attention has to implement it as well.
fusion = ["burn/fusion"]
default = ["flex", "vulkan"]
